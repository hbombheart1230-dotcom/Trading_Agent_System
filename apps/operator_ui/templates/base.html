<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='operator.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <div class="brand-kicker">Trading Agent</div>
        <div class="brand-title">Operator Console</div>
      </div>
      <nav class="nav">
        <a href="/" class="nav-link {% if section == 'overview' %}active{% endif %}">Overview</a>
        <a href="/runs" class="nav-link {% if section == 'runs' %}active{% endif %}">Recent Runs</a>
        <a href="/healthz" class="nav-link">Health JSON</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
