services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    init: true
    user: "65532:65532"
    depends_on:
      web:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in deploy/compose/.env}
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
    expose:
      - "2000"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.20
    mem_limit: 128m
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
